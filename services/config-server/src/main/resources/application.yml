spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:./infra/config-repo}
          add-label-locations: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8888
management:
  endpoints:
    web:
      exposure:
        include: health,info
