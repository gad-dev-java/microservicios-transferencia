spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8180/realms/banco-demo}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/banco-demo/protocol/openid-connect/certs}
          audiences: banco-api
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH:100}
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST:100}
                redis-rate-limiter.requestedTokens: ${RATE_LIMIT_REQUESTED_TOKENS:1}
          routes:
            - id: "${ROUTE_ID_PREFIX:}cuentas"
              uri: ${TRANSFERENCIAS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/cuentas,/api/v1/cuentas/**
            - id: "${ROUTE_ID_PREFIX:}transferencias"
              uri: ${TRANSFERENCIAS_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/transferencias,/api/v1/transferencias/**
            - id: "${ROUTE_ID_PREFIX:}notificaciones"
              uri: ${NOTIFICACIONES_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/notificaciones

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
