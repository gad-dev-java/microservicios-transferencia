apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: banca-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: banca-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: banca-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: banca-demo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banca-demo
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: banca-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_USER, value: banco_app}
            - {name: POSTGRES_DB, value: contabilidad}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-secrets, key: postgres-password}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U banco_app -d contabilidad']}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, 'pg_isready -U banco_app -d contabilidad']}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        - name: init
          configMap: {name: postgres-init}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: banca-demo
spec:
  selector: {app: keycloak}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: banca-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.1
          imagePullPolicy: IfNotPresent
          args: [start-dev, --import-realm]
          env:
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-secrets, key: keycloak-admin-password}}
            - {name: KC_HOSTNAME, value: 'http://localhost:18180'}
          ports: [{containerPort: 8080}]
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import/banco-demo-realm.json, subPath: banco-demo-realm.json, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: keycloak-data}
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: banca-demo
spec:
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
    - {name: client, port: 19092, targetPort: 19092}
    - {name: controller, port: 29093, targetPort: 29093}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: banca-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      initContainers:
        - name: volume-permissions
          image: busybox:1.37
          command: [sh, -c, 'chown -R 1000:1000 /data']
          securityContext: {runAsUser: 0}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: kafka
          image: apache/kafka:4.4.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: KAFKA_NODE_ID, value: '1'}
            - {name: KAFKA_PROCESS_ROLES, value: 'broker,controller'}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'}
            - {name: KAFKA_LISTENERS, value: 'CONTROLLER://:29093,PLAINTEXT://:19092'}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: 'PLAINTEXT://kafka:19092'}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: '1@kafka:29093'}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: '0'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: '1'}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: '1'}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: '1'}
            - {name: KAFKA_LOG_DIRS, value: /tmp/kraft-combined-logs}
            - {name: CLUSTER_ID, value: 4L6g3nShT-eMCtK--X86sw}
          ports: [{containerPort: 19092}]
          readinessProbe:
            exec: {command: [sh, -c, '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1']}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 20
          livenessProbe:
            tcpSocket: {port: 19092}
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts: [{name: data, mountPath: /tmp/kraft-combined-logs}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: kafka-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: banca-demo
spec:
  selector: {app: mongo}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: banca-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: mongo}
  template:
    metadata:
      labels: {app: mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:8.0.32
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 27017}]
          readinessProbe:
            exec: {command: [mongosh, --quiet, --eval, "db.adminCommand('ping').ok"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: {port: 27017}
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts: [{name: data, mountPath: /data/db}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mongo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banca-demo
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: banca-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:8.2.11-alpine3.22
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 6379}]
