apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: banca-demo
spec:
  selector: {app: config-server}
  ports: [{port: 8888, targetPort: 8888}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: banca-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: config-server}
  template:
    metadata:
      labels: {app: config-server}
    spec:
      containers:
        - name: config-server
          image: proyecto-microservicios-config-server:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: SERVER_ADDRESS, value: 0.0.0.0}
            - {name: CONFIG_REPO_LOCATION, value: 'file:/config-repo'}
          ports: [{containerPort: 8888}]
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8888}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8888}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts: [{name: config-repo, mountPath: /config-repo, readOnly: true}]
      volumes:
        - name: config-repo
          configMap: {name: config-repo}
---
