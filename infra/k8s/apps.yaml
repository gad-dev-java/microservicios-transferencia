apiVersion: v1
kind: Service
metadata:
  name: contabilidad
  namespace: banca-demo
spec:
  selector: {app: contabilidad}
  ports: [{port: 8082, targetPort: 8082}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contabilidad
  namespace: banca-demo
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: contabilidad}
  template:
    metadata:
      labels: {app: contabilidad}
    spec:
      containers:
        - name: contabilidad
          image: proyecto-microservicios-contabilidad:latest
          imagePullPolicy: IfNotPresent
          env:
            - {name: JAVA_TOOL_OPTIONS, value: '-Xms64m -Xmx384m'}
            - {name: SERVER_ADDRESS, value: 0.0.0.0}
            - {name: SPRING_PROFILES_ACTIVE, value: local}
            - {name: DB_URL, value: 'jdbc:postgresql://postgres:5432/contabilidad'}
            - {name: DB_USER, value: banco_app}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: demo-secrets, key: postgres-password}}
            - {name: OIDC_ISSUER, value: 'http://localhost:18180/realms/banco-demo'}
            - {name: OIDC_JWK_SET_URI, value: 'http://keycloak:8080/realms/banco-demo/protocol/openid-connect/certs'}
            - {name: KAFKA_BOOTSTRAP, value: 'kafka:19092'}
            - {name: OUTBOX_ENABLED, value: 'true'}
            - {name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY, value: '0.1'}
            - {name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT, value: 'http://zipkin:9411/api/v2/spans'}
            - {name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: 'health,info,metrics,prometheus'}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: 'true'}
          ports: [{containerPort: 8082}]
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            initialDelaySeconds: 150
            periodSeconds: 10
            timeoutSeconds: 5
---
