openapi: 3.0.3
info:
  title: Simulador de transferencias bancarias
  version: 1.0.0
  description: API pública del MVP. Opera únicamente con usuarios, cuentas y dinero simulados en PEN.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
tags:
  - name: Cuentas
  - name: Transferencias
  - name: Notificaciones
  - name: Historial
paths:
  /historial:
    get:
      tags: [Historial]
      summary: Buscar transferencias confirmadas propias en una proyección asíncrona
      operationId: buscarHistorial
      parameters:
        - name: desde
          in: query
          schema: {type: string, format: date-time}
        - name: hasta
          in: query
          schema: {type: string, format: date-time}
        - name: cuentaId
          in: query
          schema: {type: string, format: uuid}
        - name: limite
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Transferencias confirmadas del titular, ordenadas de la más reciente a la más antigua. Puede haber atraso respecto a Contabilidad.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaHistorial'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar avisos simulados propios por transferencias confirmadas
      operationId: listarNotificaciones
      responses:
        '200':
          description: Hasta 100 avisos propios, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /cuentas:
    get:
      tags: [Cuentas]
      summary: Listar cuentas del usuario autenticado
      operationId: listarCuentas
      responses:
        '200':
          description: Cuentas propias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cuenta'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /cuentas/{cuentaId}:
    get:
      tags: [Cuentas]
      summary: Consultar una cuenta propia
      operationId: obtenerCuenta
      parameters:
        - $ref: '#/components/parameters/CuentaId'
      responses:
        '200':
          description: Cuenta propia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
  /transferencias:
    post:
      tags: [Transferencias]
      summary: Crear una transferencia interna simulada
      description: >-
        La misma Idempotency-Key para el mismo usuario y el mismo cuerpo devuelve
        el mismo transferId y su estado actual. Una clave reutilizada con otro
        cuerpo devuelve 409. Una transferencia creada puede quedar RECHAZADA.
      operationId: crearTransferencia
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearTransferencia'
      responses:
        '201':
          description: Recurso creado con estado definitivo CONFIRMADA o RECHAZADA
          headers:
            Location:
              schema:
                type: string
              description: URL para consultar la transferencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transferencia'
        '200':
          description: Solicitud repetida con el mismo cuerpo; transferencia existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transferencia'
        '202':
          description: Resultado contable aún pendiente de conciliación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transferencia'
        '400':
          $ref: '#/components/responses/SolicitudInvalida'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoIdempotencia'
    get:
      tags: [Transferencias]
      summary: Listar transferencias del usuario autenticado
      operationId: listarTransferencias
      parameters:
        - name: limit
          in: query
          description: Cantidad máxima de resultados, ordenados del más reciente al más antiguo
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: Cursor opaco de la página anterior
          schema:
            type: string
      responses:
        '200':
          description: Página de transferencias propias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTransferencias'
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /transferencias/{transferenciaId}:
    get:
      tags: [Transferencias]
      summary: Consultar una transferencia propia
      operationId: obtenerTransferencia
      parameters:
        - $ref: '#/components/parameters/TransferenciaId'
      responses:
        '200':
          description: Estado actual de la transferencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transferencia'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CuentaId:
      name: cuentaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransferenciaId:
      name: transferenciaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente para esta solicitud
      schema:
        type: string
        format: uuid
  responses:
    SolicitudInvalida:
      description: Campos o formato inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Recurso inexistente o no accesible para este usuario
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictoIdempotencia:
      description: Clave de idempotencia usada con otro cuerpo
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    EntradaHistorial:
      type: object
      required: [eventId, transferenciaId, cuentaOrigenId, cuentaDestinoId, importe, moneda, ocurridaEn]
      properties:
        eventId: {type: string, format: uuid}
        transferenciaId: {type: string, format: uuid}
        cuentaOrigenId: {type: string, format: uuid}
        cuentaDestinoId: {type: string, format: uuid}
        importe: {type: string, pattern: '^(0|[1-9][0-9]{0,16})\.[0-9]{2}$'}
        moneda: {type: string, enum: [PEN]}
        ocurridaEn: {type: string, format: date-time}
    Notificacion:
      type: object
      required: [eventId, transferenciaId, estado, creadaEn]
      properties:
        eventId:
          type: string
          format: uuid
        transferenciaId:
          type: string
          format: uuid
        estado:
          type: string
          enum: [SIMULADA]
        creadaEn:
          type: string
          format: date-time
    Cuenta:
      type: object
      required: [id, moneda, saldoDisponible, estado]
      properties:
        id:
          type: string
          format: uuid
        moneda:
          type: string
          enum: [PEN]
        saldoDisponible:
          type: string
          pattern: '^[0-9]+\.[0-9]{2}$'
          example: '1500.00'
        estado:
          type: string
          enum: [ACTIVA, INACTIVA]
    CrearTransferencia:
      type: object
      additionalProperties: false
      required: [cuentaOrigenId, cuentaDestinoId, importe, moneda]
      properties:
        cuentaOrigenId:
          type: string
          format: uuid
        cuentaDestinoId:
          type: string
          format: uuid
        importe:
          type: string
          pattern: '^(0|[1-9][0-9]{0,16})\.[0-9]{2}$'
          description: Decimal positivo de dos posiciones; 0.00 se rechaza por regla de negocio
          example: '100.00'
        moneda:
          type: string
          enum: [PEN]
    Transferencia:
      type: object
      required: [id, cuentaOrigenId, cuentaDestinoId, importe, moneda, estado, creadaEn, actualizadaEn]
      properties:
        id:
          type: string
          format: uuid
        cuentaOrigenId:
          type: string
          format: uuid
        cuentaDestinoId:
          type: string
          format: uuid
        importe:
          type: string
          example: '100.00'
        moneda:
          type: string
          enum: [PEN]
        estado:
          type: string
          enum: [RECIBIDA, EVALUANDO, CONTABILIZANDO, PENDIENTE_CONCILIACION, CONFIRMADA, RECHAZADA]
        motivo:
          type: string
          nullable: true
          description: Código de motivo cuando la transferencia es RECHAZADA
          example: INSUFFICIENT_FUNDS
        creadaEn:
          type: string
          format: date-time
        actualizadaEn:
          type: string
          format: date-time
    PaginaTransferencias:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transferencia'
        siguienteCursor:
          type: string
          nullable: true
    Error:
      type: object
      required: [codigo, mensaje, traceId]
      properties:
        codigo:
          type: string
          example: IDEMPOTENCY_CONFLICT
        mensaje:
          type: string
        traceId:
          type: string
